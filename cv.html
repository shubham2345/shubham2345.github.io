    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
    <nav>
        <div class="container nav-content">
            <div class="nav-brand"><a href="/">Shubham Gaur</a></div>
            <div class="nav-links">
                <a href="/">About</a>
                <a href="publications.html">Publications</a>
                <a href="cv.html" class="active">CV</a>
                <a href="blog.html">Blog</a>
                <a href="misc.html">Misc</a>
            </div>
        </div>

    <div class="container">
        <div class="page-head">
            <div>
                <h1>Curriculum Vitae</h1>
                <p>Last updated October 2026</p>
            </div>
            <div class="page-actions">
                <a href="assets/cv/Shubham_Gaur_CV.pdf" class="btn" download><i class="fas fa-download"></i>
                    Download PDF</a>
                <a href="assets/cv/Shubham_Gaur_CV.pdf" class="btn btn-ghost" target="_blank" rel="noopener"><i
                        class="fas fa-up-right-from-square"></i> Open in new tab</a>
            </div>
        </div>

        <div id="pdf-stack" class="pdf-stack" aria-label="Curriculum vitae, rendered"></div>

        <div id="pdf-status" class="pdf-status">Loading CV&hellip;</div>

        <noscript>
            <div class="pdf-status">
                The in-page viewer needs JavaScript.
                <a href="assets/cv/Shubham_Gaur_CV.pdf">Open the CV as a PDF instead</a>.
            </div>
        </noscript>

        <footer>
            <p>&copy; 2026 Shubham Gaur &middot; Last updated October 2026</p>
        </footer>
    </div>

    <script type="module">
        import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.worker.min.mjs";

        const FILE = "assets/cv/Shubham_Gaur_CV.pdf";
        const stack = document.getElementById("pdf-stack");
        const status = document.getElementById("pdf-status");

        const fail = () => {
            stack.innerHTML = "";
            status.innerHTML =
                'The CV viewer could not load. <a href="' + FILE + '">Open the PDF directly</a>.';
            status.hidden = false;
        };

        // Render every page to its own canvas, sized to the container and the
        // device pixel ratio so the text stays sharp on retina screens.
        const render = async (doc) => {
            const width = stack.clientWidth || 900;
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            stack.innerHTML = "";

            for (let n = 1; n <= doc.numPages; n++) {
                const page = await doc.getPage(n);
                const unscaled = page.getViewport({ scale: 1 });
                const viewport = page.getViewport({ scale: (width / unscaled.width) * ratio });

                const canvas = document.createElement("canvas");
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.setAttribute("role", "img");
                canvas.setAttribute("aria-label", `CV page ${n} of ${doc.numPages}`);
                stack.appendChild(canvas);

                await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
            }
        };

        try {
            const doc = await pdfjsLib.getDocument(FILE).promise;
            await render(doc);
            status.hidden = true;

            let timer;
            let lastWidth = stack.clientWidth;
            window.addEventListener("resize", () => {
                if (stack.clientWidth === lastWidth) return;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    lastWidth = stack.clientWidth;
                    render(doc).catch(fail);
                }, 200);
            });
        } catch (err) {
            console.error(err);
            fail();
        }
    </script>

    <script nomodule>
        document.getElementById("pdf-status").innerHTML =
            'This browser cannot run the in-page viewer. ' +
            '<a href="assets/cv/Shubham_Gaur_CV.pdf">Open the CV as a PDF instead</a>.';
    </script>
</body>

</html>
